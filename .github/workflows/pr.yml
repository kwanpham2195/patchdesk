name: Pull request gates

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify pull request
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # No `version:` here on purpose. `package.json`'s `packageManager`
      # field already pins pnpm, and action-setup refuses to start when the
      # two disagree: "Multiple versions of pnpm specified". One source, and
      # it is the one the repository uses locally.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            runtime/flue/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Check changed source quality
        run: >-
          pnpm lint:changed --
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

      - name: Check the Knip ratchet
        run: >-
          pnpm knip:ratchet --
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

      - name: Check the scripts/ typecheck ratchet
        run: >-
          pnpm typecheck:scripts --
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

      - name: Check renderer error surfaces
        run: pnpm check:error-ui

      - name: Lint the whole repository
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run complete tests
        run: pnpm test:all

      - name: Build the app
        run: pnpm build

      - name: Check renderer bundle separation
        run: pnpm check:bundle

      - name: Run browser tests
        run: pnpm exec playwright test
