name: CI

# Backstop for the local landing gate (`pnpm check`, run before merge).
# Pushes to main only; pull requests are gated locally (CONTRIBUTING.md).
on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The context budget step reads the budget and messages from before the push.
          fetch-depth: 0

      # No `version:` here on purpose: `package.json`'s `packageManager` pins
      # pnpm, and action-setup refuses two sources.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

      - name: Check the scripts/ typecheck ratchet
        run: pnpm typecheck:scripts

      - name: Check the model-facing text budget
        run: node scripts/check-context-budget.mjs --ci "$BEFORE"
        env:
          BEFORE: ${{ github.event.before }}

      - name: Check error surfaces, imports and the Knip ratchet
        run: pnpm check:error-ui && pnpm check:imports && pnpm knip:ratchet

      - name: Lint the whole repository
        run: pnpm lint

      # The release installer is macOS-only (ditto, lsappinfo, xattr); its
      # test runs in the `desktop` job.
      - name: Run complete tests
        run: pnpm exec vitest --run --exclude tests/scripts/install-release.test.ts

  desktop:
    name: Build and browser tests
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Build the app
        run: pnpm build

      - name: Check renderer bundle separation
        run: pnpm check:bundle

      - name: Run the release installer tests
        run: pnpm exec vitest --run tests/scripts/install-release.test.ts

      - name: Run browser tests
        run: pnpm exec playwright test
