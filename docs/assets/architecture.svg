<text x="68" y="236" class="tag">VIEW PROCESS</text>
<text x="68" y="272" class="name">React renderer</text>
<text x="68" y="302" class="small">Pull requests · Review</text>
<text x="68" y="328" class="small">Sandboxed; no Node.js</text>
<rect x="48" y="400" width="288" height="104" rx="8" fill="#ffffff" stroke="#bfc0c0" stroke-width="1.5"/>
<text x="68" y="428" class="name">Preload bridge</text>
<text x="68" y="458" class="small">window.patchdesk.request</text>
<text x="68" y="484" class="small">Isolated renderer context</text>
<rect x="456" y="400" width="224" height="104" rx="8" fill="#ffffff" stroke="#bfc0c0" stroke-width="1.5"/>
<text x="476" y="428" class="name">Desktop bridge</text>
<text x="476" y="458" class="small">Sender + route allowlist</text>
<text x="476" y="484" class="small">IPC handler</text>
<rect x="744" y="400" width="256" height="104" rx="8" fill="#ffffff" stroke="#bfc0c0" stroke-width="1.5"/>
<text x="764" y="428" class="name">Local API</text>
<text x="764" y="458" class="small">Hono · 127.0.0.1:random</text>
<text x="764" y="484" class="small">Capability + origin</text>
<rect x="48" y="552" width="288" height="160" rx="8" fill="#ffffff" stroke="#bfc0c0" stroke-width="1.5"/>
<text x="68" y="580" class="tag">SEPARATE PROCESS</text>
<text x="68" y="616" class="name">MCP server</text>
<text x="68" y="646" class="small">patchdesk mcp</text>
<text x="68" y="672" class="small">Client ↔ server: stdio</text>
<text x="68" y="698" class="small">Runs on the app’s Node</text>
<rect x="456" y="568" width="224" height="152" rx="8" fill="#ffffff" stroke="#bfc0c0" stroke-width="1.5"/>
<text x="476" y="596" class="name">MCP listener</text>
<text x="476" y="626" class="small">Unix socket</text>
<text x="476" y="652" class="small">0700 parent directory</text>
<text x="476" y="678" class="small">Revalidates tool input</text>
<rect x="744" y="568" width="256" height="152" rx="8" fill="#fff0e8" stroke="#eb6c36" stroke-width="2"/>
<text x="764" y="596" class="name">Services</text>
<text x="764" y="626" class="small">Review orchestration</text>
<text x="764" y="652" class="small">Insight run + validation</text>
<text x="764" y="678" class="small">Shared by API and MCP</text>
<rect x="456" y="768" width="224" height="112" rx="8" fill="#ffffff" stroke="#bfc0c0" stroke-width="1.5"/>
<text x="476" y="796" class="name">Domain</text>
<text x="476" y="826" class="small">Types, parsers,</text>
<text x="476" y="852" class="small">pure state transitions</text>
<rect x="744" y="768" width="256" height="176" rx="8" fill="#ffffff" stroke="#bfc0c0" stroke-width="1.5"/>
<text x="764" y="796" class="name">Adapters</text>
<text x="764" y="826" class="small">GitHub HTTPS transport</text>
<text x="764" y="852" class="small">Atomic JSON stores</text>
<text x="764" y="878" class="small">Codex / pi RPC clients</text>
<text x="764" y="904" class="small">Git command runner</text>
<rect x="1120" y="264" width="272" height="232" rx="8" fill="#ffffff" stroke="#bfc0c0" stroke-width="1.5"/>
<text x="1140" y="292" class="tag">CHILD PROCESSES</text>
<text x="1140" y="328" class="name">Insight providers</text>
<text x="1140" y="358" class="small">Codex CLI account</text>
<text x="1140" y="384" class="small">codex app-server</text>
<text x="1140" y="410" class="small">pi CLI account</text>
<text x="1140" y="436" class="small">pi --mode rpc</text>
<text x="1140" y="462" class="small">Fresh native sessions</text>
<rect x="1120" y="800" width="272" height="160" rx="8" fill="#ffffff" stroke="#bfc0c0" stroke-width="1.5"/>
<text x="1140" y="828" class="tag">REMOTE</text>
<text x="1140" y="864" class="name">GitHub</text>
<text x="1140" y="894" class="small">REST + GraphQL</text>
<text x="1140" y="920" class="small">Remote truth</text>
<text x="1140" y="946" class="small">Explicit maintainer writes</text>
<rect x="456" y="1096" width="936" height="152" rx="8" fill="#ffffff" stroke="#bfc0c0" stroke-width="1.5"/>
<text x="476" y="1124" class="tag">LOCAL FILES · CONFIG / DATA / CACHE</text>
<text x="476" y="1160" class="name">Storage on disk</text>
<text x="476" y="1192" class="body">Config</text>
<text x="476" y="1220" class="small">Profiles + preferences</text>
<text x="740" y="1192" class="body">Local data</text>
<text x="740" y="1220" class="small">Reviews, Insights, evidence, logs</text>
<text x="1096" y="1192" class="body">Cache</text>
<text x="1096" y="1220" class="small">Worktrees + images</text>
<text x="48" y="768" class="small">Coding agent calls the MCP server.</text>
<text x="48" y="798" class="small">Tools reach the same services.</text>
<text x="48" y="828" class="small">An agent run request waits for</text>
<text x="48" y="854" class="small">the maintainer to start the run.</text>
<text x="48" y="916" class="small">Main captures evidence; native tools read it.</text>
<text x="48" y="944" class="small">Main validates results before retaining them.</text>
<path d="M 48 1280 H 88" class="edge"/>
<text x="100" y="1286" class="small">Request / call / file access</text>
<path d="M 400 1280 H 440" class="edge http"/>
<text x="452" y="1286" class="small">HTTP / HTTPS</text>
<text x="720" y="1286" class="small">Arrows show initiation; replies return on the same channel.</text>
</svg>
