<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1320" viewBox="0 0 1480 1320" role="img" aria-labelledby="architecture-title architecture-desc">
<title id="architecture-title">Patchdesk architecture</title>
<desc id="architecture-desc">The sandboxed React renderer uses preload and IPC to reach the main process through a protected local API; a separate MCP server reaches the same services over a Unix socket, while main owns domain decisions, GitHub transport, native provider children, and local storage.</desc>
<defs>
  <marker id="architecture-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#4f5d75" stroke-width="1.5"/></marker>
  <marker id="architecture-http" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#2e5aa8" stroke-width="1.5"/></marker>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #2d3142; }
    .title { font-size: 36px; font-weight: 700; }
    .name { font-size: 22px; font-weight: 700; }
    .body { font-size: 18px; }
    .small { font-size: 16px; fill: #4f5d75; }
    .tag { font-size: 15px; font-weight: 700; letter-spacing: 1.2px; fill: #4f5d75; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 16px; fill: #4f5d75; }
    .edge { fill: none; stroke: #4f5d75; stroke-width: 2; marker-end: url(#architecture-arrow); }
    .http { stroke: #2e5aa8; marker-end: url(#architecture-http); }
    .label { font-size: 16px; fill: #4f5d75; }
  </style>
</defs>
<rect width="1480" height="1320" fill="#f5f5f5"/>
<text x="48" y="64" class="title">Patchdesk architecture</text>
<text x="48" y="100" class="body">One local authority. Two entry paths. Revision-bound Insight evidence.</text>
<!-- Boundaries precede connectors and nodes. -->
<path d="M 32 136 H 1056 Q 1064 136 1064 144 V 992 Q 1064 1000 1056 1000 H 428 Q 420 1000 420 992 V 536 Q 420 528 412 528 H 32 Q 24 528 24 520 V 144 Q 24 136 32 136 Z" fill="#ececec" stroke="#bfc0c0"/>
<text x="48" y="168" class="tag">ELECTRON DESKTOP APP</text>
<rect x="420" y="184" width="620" height="792" rx="8" fill="#f5f5f5" stroke="#7a8399" stroke-dasharray="6 5"/>
<text x="444" y="220" class="tag">MAIN PROCESS · NODE · LOCAL AUTHORITY</text>
<text x="444" y="280" class="name">Composition root</text>
<text x="444" y="312" class="mono">src/main/</text>
<text x="444" y="348" class="body">Wires services, adapters, IPC, and lifecycle.</text>

